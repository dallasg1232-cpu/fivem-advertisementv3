<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>FiveM Advertisement Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            border: 0;
        }

        /* Fill the exact dimensions provided by the FiveM advertisement board */
        #advertisement-board {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            border: 0;
            background: transparent;
        }

        /*
            Both advertisements are layered together.

            object-fit: fill means:
            - Entire image remains visible
            - No empty space around the advertisement
            - No image cropping
            - Image automatically stretches to match the exact FiveM board dimensions
        */
        .advertisement {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;

            object-fit: fill;
            object-position: center center;

            opacity: 0;
            transition: opacity 1s ease-in-out;

            pointer-events: none;
            user-select: none;

            border: 0;
            margin: 0;
            padding: 0;
        }

        .advertisement.visible {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="advertisement-board">
        <img id="adA" class="advertisement visible" alt="">
        <img id="adB" class="advertisement" alt="">
    </div>

    <script>
        // ============================================================
        // YOUR 6 ADVERTISEMENT IMAGE FILES
        // ONLY EDIT THESE 6 FILENAMES IF YOUR IMAGE NAMES CHANGE
        // ============================================================

        const advertisements = [
            "adv1.png",
            "adv2.png",
            "adv3.png",
            "adv4.png",
            "adv5.png",
        ];

        // ============================================================
        // SLIDESHOW SETTINGS
        // ============================================================

        // 10000 milliseconds = exactly 10 seconds
        const DISPLAY_TIME = 10000;

        // 1000 milliseconds = approximately 1 second fade
        const FADE_TIME = 1000;

        const adA = document.getElementById("adA");
        const adB = document.getElementById("adB");

        let activeImage = adA;
        let inactiveImage = adB;

        let currentIndex = 0;
        let currentOrder = [];
        let validAdvertisements = [];
        let slideshowStarted = false;

        // Randomly shuffle an array.
        function shuffle(array) {
            const shuffled = array.slice();

            for (let i = shuffled.length - 1; i > 0; i--) {
                const randomIndex = Math.floor(Math.random() * (i + 1));

                const temporaryValue = shuffled[i];
                shuffled[i] = shuffled[randomIndex];
                shuffled[randomIndex] = temporaryValue;
            }

            return shuffled;
        }

        // Get all configured advertisements.
        function getConfiguredAdvertisements() {
            return advertisements.filter(function (url) {
                return typeof url === "string" && url.trim() !== "";
            });
        }

        // Create a fresh shuffled cycle.
        function createNewCycle() {
            currentOrder = shuffle(validAdvertisements);
            currentIndex = 0;
        }

        // Preload an image before attempting to display it.
        function preloadImage(url, callback) {
            const image = new Image();
            let completed = false;

            function finish(success) {
                if (completed) return;

                completed = true;

                image.onload = null;
                image.onerror = null;

                callback(success);
            }

            image.onload = function () {
                finish(true);
            };

            image.onerror = function () {
                finish(false);
            };

            image.src = url;
        }

        // Find the next working advertisement.
        // Failed images are removed and automatically skipped.
        function loadNextValidAdvertisement(callback) {
            if (validAdvertisements.length === 0) {
                callback(null);
                return;
            }

            let attempts = 0;

            function tryNext() {
                if (validAdvertisements.length === 0) {
                    callback(null);
                    return;
                }

                // Once all ads in this cycle have played,
                // shuffle all remaining working ads again.
                if (currentIndex >= currentOrder.length) {
                    createNewCycle();
                }

                const url = currentOrder[currentIndex];

                currentIndex++;
                attempts++;

                preloadImage(url, function (success) {
                    if (success) {
                        callback(url);
                        return;
                    }

                    // Remove broken image so it cannot stop the slideshow.
                    validAdvertisements = validAdvertisements.filter(function (item) {
                        return item !== url;
                    });

                    currentOrder = currentOrder.filter(function (item) {
                        return item !== url;
                    });

                    // Stop searching if every image has failed.
                    if (
                        attempts >= advertisements.length ||
                        validAdvertisements.length === 0
                    ) {
                        callback(null);
                        return;
                    }

                    tryNext();
                });
            }

            tryNext();
        }

        // Smoothly crossfade to the next advertisement.
        function showAdvertisement(url, immediate) {
            inactiveImage.src = url;

            // Force FiveM CEF/browser to register the new image.
            inactiveImage.offsetHeight;

            if (immediate) {
                activeImage.classList.remove("visible");
                inactiveImage.classList.add("visible");

                const temporaryImage = activeImage;
                activeImage = inactiveImage;
                inactiveImage = temporaryImage;

                return;
            }

            inactiveImage.classList.add("visible");
            activeImage.classList.remove("visible");

            const temporaryImage = activeImage;
            activeImage = inactiveImage;
            inactiveImage = temporaryImage;
        }

        // Display each advertisement for exactly 10 seconds.
        function scheduleNextAdvertisement() {
            setTimeout(function () {
                loadNextValidAdvertisement(function (url) {
                    if (url) {
                        showAdvertisement(url, false);
                        scheduleNextAdvertisement();
                    } else {
                        slideshowStarted = false;

                        // Retry if all images temporarily fail.
                        setTimeout(startSlideshow, DISPLAY_TIME);
                    }
                });
            }, DISPLAY_TIME);
        }

        // Automatically start the slideshow when the webpage loads.
        function startSlideshow() {
            if (slideshowStarted) return;

            validAdvertisements = getConfiguredAdvertisements();

            if (validAdvertisements.length === 0) {
                setTimeout(startSlideshow, DISPLAY_TIME);
                return;
            }

            slideshowStarted = true;

            // Shuffle the first cycle.
            createNewCycle();

            loadNextValidAdvertisement(function (url) {
                if (!url) {
                    slideshowStarted = false;

                    setTimeout(startSlideshow, DISPLAY_TIME);
                    return;
                }

                // Show the first advertisement immediately.
                activeImage.src = url;
                activeImage.classList.add("visible");
                inactiveImage.classList.remove("visible");

                scheduleNextAdvertisement();
            });
        }

        // Start automatically.
        startSlideshow();
    </script>

</body>
</html>
