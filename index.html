<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>FiveM Advertisement Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            border: 0;
        }

        /* Fill the exact area provided by the FiveM CEF advertisement board */
        #advertisement-board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            border: 0;
            background: transparent;
        }

        /* Both images are layered on top of each other for crossfading */
        .advertisement {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            transform: translate(-50%, -50%);

            /* Shows the ENTIRE advertisement without cropping */
            object-fit: contain;
            object-position: center center;

            opacity: 0;

            /* Smooth 1-second crossfade */
            transition: opacity 1s ease-in-out;

            pointer-events: none;
            user-select: none;

            border: 0;
            margin: 0;
            padding: 0;
        }

        .advertisement.visible {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="advertisement-board">
        <img id="adA" class="advertisement visible" alt="">
        <img id="adB" class="advertisement" alt="">
    </div>

    <script>
        // ============================================================
        // YOUR 6 ADVERTISEMENT IMAGE FILES
        // ONLY EDIT THESE FILENAMES IF YOUR IMAGE NAMES CHANGE
        // ============================================================

        const advertisements = [
            "adv1.png",
            "adv2.png",
            "adv3.png",
            "adv4.png",
            "adv5.png",
        ];

        // ============================================================
        // SLIDESHOW SETTINGS
        // ============================================================

        // 10000 milliseconds = 10 seconds
        const DISPLAY_TIME = 10000;

        const adA = document.getElementById("adA");
        const adB = document.getElementById("adB");

        let activeImage = adA;
        let inactiveImage = adB;

        let currentIndex = 0;
        let currentOrder = [];
        let validAdvertisements = [];
        let slideshowStarted = false;

        // Shuffle advertisements into a random order.
        function shuffle(array) {
            const shuffled = array.slice();

            for (let i = shuffled.length - 1; i > 0; i--) {
                const randomIndex = Math.floor(Math.random() * (i + 1));

                const temporaryValue = shuffled[i];
                shuffled[i] = shuffled[randomIndex];
                shuffled[randomIndex] = temporaryValue;
            }

            return shuffled;
        }

        // Get all non-empty advertisement filenames.
        function getConfiguredAdvertisements() {
            return advertisements.filter(function (url) {
                return typeof url === "string" && url.trim() !== "";
            });
        }

        // Start a fresh shuffled cycle.
        function createNewCycle() {
            currentOrder = shuffle(validAdvertisements);
            currentIndex = 0;
        }

        // Preload an advertisement before displaying it.
        function preloadImage(url, callback) {
            const image = new Image();

            let completed = false;

            function finish(success) {
                if (completed) return;

                completed = true;

                image.onload = null;
                image.onerror = null;

                callback(success);
            }

            image.onload = function () {
                finish(true);
            };

            image.onerror = function () {
                finish(false);
            };

            image.src = url;
        }

        // Load the next working advertisement.
        // Broken images are automatically removed and skipped.
        function loadNextValidAdvertisement(callback) {
            if (validAdvertisements.length === 0) {
                callback(null);
                return;
            }

            let attempts = 0;

            function tryNext() {
                if (validAdvertisements.length === 0) {
                    callback(null);
                    return;
                }

                if (currentIndex >= currentOrder.length) {
                    createNewCycle();
                }

                const url = currentOrder[currentIndex];

                currentIndex++;
                attempts++;

                preloadImage(url, function (success) {
                    if (success) {
                        callback(url);
                        return;
                    }

                    // Remove the broken image permanently
                    // for the rest of this session.
                    validAdvertisements = validAdvertisements.filter(function (item) {
                        return item !== url;
                    });

                    currentOrder = currentOrder.filter(function (item) {
                        return item !== url;
                    });

                    // Prevent an infinite loop if everything fails.
                    if (
                        attempts >= advertisements.length ||
                        validAdvertisements.length === 0
                    ) {
                        callback(null);
                        return;
                    }

                    tryNext();
                });
            }

            tryNext();
        }

        // Crossfade from the current image to the next image.
        function showAdvertisement(url, immediate) {
            inactiveImage.src = url;

            // Force FiveM CEF to register the new image before fading.
            inactiveImage.offsetHeight;

            if (immediate) {
                activeImage.classList.remove("visible");
                inactiveImage.classList.add("visible");

                const temporaryImage = activeImage;
                activeImage = inactiveImage;
                inactiveImage = temporaryImage;

                return;
            }

            inactiveImage.classList.add("visible");
            activeImage.classList.remove("visible");

            const temporaryImage = activeImage;
            activeImage = inactiveImage;
            inactiveImage = temporaryImage;
        }

        // Wait 10 seconds before showing the next advertisement.
        function scheduleNextAdvertisement() {
            setTimeout(function () {
                loadNextValidAdvertisement(function (url) {
                    if (url) {
                        showAdvertisement(url, false);
                        scheduleNextAdvertisement();
                    } else {
                        slideshowStarted = false;

                        // Retry later if all images failed.
                        setTimeout(startSlideshow, DISPLAY_TIME);
                    }
                });
            }, DISPLAY_TIME);
        }

        // Automatically start when the FiveM webpage loads.
        function startSlideshow() {
            if (slideshowStarted) return;

            validAdvertisements = getConfiguredAdvertisements();

            if (validAdvertisements.length === 0) {
                setTimeout(startSlideshow, DISPLAY_TIME);
                return;
            }

            slideshowStarted = true;

            // Randomise the first cycle.
            createNewCycle();

            loadNextValidAdvertisement(function (url) {
                if (!url) {
                    slideshowStarted = false;

                    setTimeout(startSlideshow, DISPLAY_TIME);
                    return;
                }

                // Display the first image immediately.
                activeImage.src = url;
                activeImage.classList.add("visible");

                inactiveImage.classList.remove("visible");

                scheduleNextAdvertisement();
            });
        }

        // Start automatically.
        startSlideshow();
    </script>

</body>
</html>
