<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>FiveM Advertisement Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            border: 0;
            background: transparent;
        }

        /* Automatically fills whatever size the FiveM CEF advertisement board is */
        #advertisement-board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            border: 0;
        }

        .advertisement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            object-position: center center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
            border: 0;
            margin: 0;
            padding: 0;
        }

        .advertisement.visible {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="advertisement-board">
        <img id="adA" class="advertisement visible" alt="">
        <img id="adB" class="advertisement" alt="">
    </div>

    <script>
        // ============================================================
        // YOUR 6 ADVERTISEMENT IMAGE FILES
        // ONLY EDIT THESE FILENAMES IF YOUR IMAGE NAMES CHANGE
        // ============================================================

        const advertisements = [
            "adv1.png",
            "adv2.png",
            "adv3.png",
            "adv4.png",
            "adv5.png",
        ];

        // ============================================================
        // SLIDESHOW SETTINGS
        // ============================================================

        // 10000 milliseconds = exactly 10 seconds
        const DISPLAY_TIME = 10000;

        const adA = document.getElementById("adA");
        const adB = document.getElementById("adB");

        let activeImage = adA;
        let inactiveImage = adB;
        let currentIndex = 0;
        let currentOrder = [];
        let validAdvertisements = [];
        let slideshowStarted = false;

        // Randomly shuffle advertisements.
        function shuffle(array) {
            const shuffled = array.slice();

            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = shuffled[i];
                shuffled[i] = shuffled[j];
                shuffled[j] = temp;
            }

            return shuffled;
        }

        // Get all configured advertisements.
        function getConfiguredAdvertisements() {
            return advertisements.filter(function (url) {
                return typeof url === "string" && url.trim() !== "";
            });
        }

        // Create a newly shuffled cycle.
        function createNewCycle() {
            currentOrder = shuffle(validAdvertisements);
            currentIndex = 0;
        }

        // Preload an image before displaying it.
        function preloadImage(url, callback) {
            const image = new Image();
            let completed = false;

            function finish(success) {
                if (completed) return;

                completed = true;
                image.onload = null;
                image.onerror = null;

                callback(success);
            }

            image.onload = function () {
                finish(true);
            };

            image.onerror = function () {
                finish(false);
            };

            image.src = url;
        }

        // Find and load the next working advertisement.
        function loadNextValidAdvertisement(callback) {
            if (validAdvertisements.length === 0) {
                callback(null);
                return;
            }

            let attempts = 0;

            function tryNext() {
                if (validAdvertisements.length === 0) {
                    callback(null);
                    return;
                }

                if (currentIndex >= currentOrder.length) {
                    createNewCycle();
                }

                const url = currentOrder[currentIndex];
                currentIndex++;
                attempts++;

                preloadImage(url, function (success) {
                    if (success) {
                        callback(url);
                        return;
                    }

                    // Remove failed image so it does not stop the slideshow.
                    validAdvertisements = validAdvertisements.filter(function (item) {
                        return item !== url;
                    });

                    currentOrder = currentOrder.filter(function (item) {
                        return item !== url;
                    });

                    if (
                        attempts >= advertisements.length ||
                        validAdvertisements.length === 0
                    ) {
                        callback(null);
                        return;
                    }

                    tryNext();
                });
            }

            tryNext();
        }

        // Smoothly crossfade to the next advertisement.
        function showAdvertisement(url, immediate) {
            inactiveImage.src = url;

            // Force CEF/browser to register the new image before fading.
            inactiveImage.offsetHeight;

            if (immediate) {
                activeImage.classList.remove("visible");
                inactiveImage.classList.add("visible");

                const temp = activeImage;
                activeImage = inactiveImage;
                inactiveImage = temp;

                return;
            }

            inactiveImage.classList.add("visible");
            activeImage.classList.remove("visible");

            const temp = activeImage;
            activeImage = inactiveImage;
            inactiveImage = temp;
        }

        // Wait 10 seconds, then move to the next advertisement.
        function scheduleNextAdvertisement() {
            setTimeout(function () {
                loadNextValidAdvertisement(function (url) {
                    if (url) {
                        showAdvertisement(url, false);
                        scheduleNextAdvertisement();
                    } else {
                        slideshowStarted = false;

                        // Retry later if every image failed.
                        setTimeout(startSlideshow, DISPLAY_TIME);
                    }
                });
            }, DISPLAY_TIME);
        }

        // Automatically start the slideshow.
        function startSlideshow() {
            if (slideshowStarted) return;

            validAdvertisements = getConfiguredAdvertisements();

            if (validAdvertisements.length === 0) {
                setTimeout(startSlideshow, DISPLAY_TIME);
                return;
            }

            slideshowStarted = true;
            createNewCycle();

            loadNextValidAdvertisement(function (url) {
                if (!url) {
                    slideshowStarted = false;
                    setTimeout(startSlideshow, DISPLAY_TIME);
                    return;
                }

                activeImage.src = url;
                activeImage.classList.add("visible");
                inactiveImage.classList.remove("visible");

                scheduleNextAdvertisement();
            });
        }

        // Start immediately when the FiveM CEF webpage loads.
        startSlideshow();
    </script>

</body>
</html>
